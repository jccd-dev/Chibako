services:
  chibako:
    build: .
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - SITE_NAME=${SITE_NAME:-Chibako}
      - CHIBAKO_SETUP_TOKEN=${CHIBAKO_SETUP_TOKEN:-}
      - CHIBAKO_TRUST_PROXY=${CHIBAKO_TRUST_PROXY:-false}
    volumes:
      - ${CHIBAKO_DATA_VOLUME:-./data}:/app/data
    networks:
      - chibako
    ports:
      - "127.0.0.1:${CHIBAKO_PORT:-3000}:3000"

networks:
  chibako:
