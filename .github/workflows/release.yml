name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jccd-dev/chibako
  TRIVY_VERSION: v0.74.0

jobs:
  quality:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: node --import tsx --test tests/*.test.ts

  pull-request-image:
    name: Build and scan pull request image
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build pull request image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: chibako:pr-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=pull-request-image
          cache-to: type=gha,mode=max,scope=pull-request-image

      - name: Scan pull request image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: chibako:pr-${{ github.event.pull_request.head.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  publish:
    name: Publish production image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image
          provenance: mode=max
          sbom: true

      - name: Scan production image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  dispatch:
    name: Trigger infra deploy
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check for INFRA_DISPATCH_TOKEN
        id: guard
        run: |
          if [ -n "${{ secrets.INFRA_DISPATCH_TOKEN }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Token present, dispatching to infra."
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "INFRA_DISPATCH_TOKEN not set — skipping infra deploy trigger."
          fi

      - name: Dispatch immutable image digest
        if: steps.guard.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: jccd-dev/chibako-infra
          event-type: chibako-image-built
          client-payload: '{"image":"${{ needs.publish.outputs.image }}","digest":"${{ needs.publish.outputs.digest }}"}'
