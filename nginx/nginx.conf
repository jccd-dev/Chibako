# Chibako nginx reverse-proxy site config (VPS).
# Place at /etc/nginx/sites-available/chibako and symlink to sites-enabled,
# then: nginx -t && systemctl reload nginx
#
# Bootstrap requirements:
#   - A domain pointing at your server (replace chibako.example.com)
#   - Ports 80 and 443 open to the VPS
#
# This is the pre-certificate configuration. It intentionally has no 443
# server, so nginx -t succeeds before Certbot has created certificates. The
# two setup locations stay closed over HTTP while the certificate is issued;
# see README.md for the post-Certbot step.

server {
    listen 80;
    listen [::]:80;
    server_name chibako.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Do not expose an unclaimed vault during HTTP bootstrap. Remove these
    # temporary guards only after HTTPS is active and nginx has been reloaded.
    location ^~ /setup { return 404; }
    location ^~ /api/setup { return 404; }

    client_max_body_size 25m;   # allow file-ish uploads / large notes

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite this dedicated limiter identity; never trust a client copy.
        proxy_set_header X-Chibako-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
