# Chibako nginx reverse-proxy site config (VPS).
# Place at /etc/nginx/sites-available/chibako and symlink to sites-enabled,
# then: nginx -t && systemctl reload nginx
#
# Requirements:
#   - A domain pointing at your server (replace chibako.example.com)
#   - Certbot for TLS:  sudo certbot --nginx -d chibako.example.com

server {
    listen 80;
    listen [::]:80;
    server_name chibako.example.com;

    # Redirect everything to HTTPS (certbot will manage the 443 block)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chibako.example.com;

    # certbot --nginx fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/chibako.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chibako.example.com/privkey.pem;

    client_max_body_size 25m;   # allow file-ish uploads / large notes

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}